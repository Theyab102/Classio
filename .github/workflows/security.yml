name: Build, tests and credential protection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sh scripts/install-security-tools.sh /tmp/classio-security-tools
      - run: npm run check:security-canaries
        env:
          GITLEAKS_BIN: /tmp/classio-security-tools/gitleaks
      - run: npm run check:audit
      - run: npm run test:server
      - run: CI=true npm test -- --watchAll=false --runInBand
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth-browser
      - run: npm run test:navigation
      - run: npm run test:source-input
      - run: npm run test:game-background
      - run: npm run test:reliable-generation
      - run: npm run test:podcast-background
      - run: npm run check:security
        env:
          GITLEAKS_BIN: /tmp/classio-security-tools/gitleaks
